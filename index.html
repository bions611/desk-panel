<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常生活工作台</title>
<style>
/* ===== 设计 token ===== */
:root{
  /* ===== 底 & 中性（晨光绿：整体提亮） ===== */
  --bg:#F7F9F4;
  --surface:#FFFFFF;
  --surface-2:#F0F4ED;
  --line:#DCE4D8;
  /* ===== 文字三级（微调，保证亮背景上的可读性） ===== */
  --ink:#1F2622;
  --ink-2:#4E6156;
  --ink-3:#7E8D82;
  --ink-rgb:35,43,39;                        /* 半透明遮罩/底衬用 */
  /* ===== 主色：三档 + 深浅阶（提亮一档，鲜活不艳） ===== */
  --primary:#3B8060;
  --primary-deep:#27523C;
  --primary-soft:#E6F1E8;
  --primary-t1:#D8ECDD;                      /* 主色深浅阶 1（年视图热力图） */
  --primary-t2:#A5D5B8;                      /* 阶 2 */
  --primary-t3:#68BC8E;                      /* 阶 3（阶 4 = --primary） */
  --primary-mid:#93B286;                     /* 主色中间调：focus / 悬停边框 */
  --primary-ink:#3E5A44;                     /* 浅绿底上的深绿文字 */
  --primary-rgb:59,128,96;
  /* ===== 点缀（暖橙）：同步提亮 ===== */
  --accent:#F08C3F;
  --accent-soft:#F8E7D8;
  --accent-deep:#B25E1F;
  /* ===== 分类色：每类固定三档（中 / 浅底 / 浅底上的深字，保持不变） ===== */
  --rose:#C26A8B;
  --rose-soft:#F3DFE7;
  --rose-deep:#8A4360;
  --rose-line:#E8CBD6;
  --blue:#3E6E8C;
  --blue-soft:#DCE8F0;
  --blue-deep:#2C5A78;
  --hike:#7A9A5B;                            /* 徒步 */
  --hike-rgb:122,154,91;
  --danger:#C0553F;
  --seal:#B3BCB2;                            /* 装饰件灰绿 */
  /* ===== 侧边栏：深绿底上的四档浅色（保持） ===== */
  --side-ink:#E9EFEB;
  --side-nav:#C7D6CC;
  --side-sub:#A9BFB2;
  --side-foot:#8FA79B;
  /* ===== 形 ===== */
  --radius:14px;
  --shadow:0 1px 2px rgba(35,43,39,.05),0 6px 18px -8px rgba(35,43,39,.12);
  --shadow-lift:0 2px 4px rgba(35,43,39,.06),0 14px 34px -12px rgba(35,43,39,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
h1,h2,h3{font-weight:650;letter-spacing:.01em}

/* ===== 整体布局 ===== */
.app{display:flex;min-height:100vh}

/* ===== 侧边导航 ===== */
.sidebar{
  width:224px;flex:0 0 224px;
  background:var(--primary-deep);
  color:var(--side-ink);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  padding:22px 12px 16px;
  transition:width .18s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand-mark{
  width:34px;height:34px;border-radius:10px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 10px -2px rgba(0,0,0,.35);
}
.brand-name{font-size:16px;font-weight:700;letter-spacing:.04em}
.brand-sub{font-size:11px;color:var(--side-sub);margin-top:1px}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;margin-top:16px;overflow:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  color:var(--side-nav);font-size:14px;text-decoration:none;
  transition:background .15s,color .15s;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600}
.nav-item.active svg{opacity:1}
.nav-foot{margin-top:12px;padding:10px 12px;font-size:11px;color:var(--side-foot);border-top:1px solid rgba(255,255,255,.1)}
.nav-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

/* ===== 侧边栏折叠（桌面端）：点品牌栏右侧按钮收起成图标栏 ===== */
.brand-txt{flex:1;min-width:0}
.nav-toggle{
  width:28px;height:28px;border-radius:8px;margin-left:auto;
  display:flex;align-items:center;justify-content:center;
  color:var(--side-nav);transition:background .15s,color .15s;flex:0 0 28px;
}
.nav-toggle:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-toggle svg{width:16px;height:16px}
@media(min-width:769px){
  .sidebar.collapsed{width:68px;flex-basis:68px;padding:20px 8px 14px}
  .sidebar.collapsed .brand{justify-content:center;gap:0;padding:2px 0 16px}
  .sidebar.collapsed .brand-txt{display:none}
  .sidebar.collapsed .nav-toggle{margin-left:0}
  .sidebar.collapsed .nav{gap:4px}
  .sidebar.collapsed .nav-item{justify-content:center;padding:11px 0}
  .sidebar.collapsed .nav-label{display:none}
  .sidebar.collapsed .nav-foot{display:none}
}

/* 移动端汉堡 */
.hamburger{display:none}
.scrim{display:none}

/* ===== 主内容区 ===== */
.main{flex:1;min-width:0;padding:26px 30px 48px}
.view{display:none;animation:fadeIn .18s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700}
.page-title .tag{
  display:inline-block;font-size:12px;font-weight:500;color:var(--primary);
  background:var(--primary-soft);border-radius:999px;padding:2px 10px;vertical-align:3px;margin-left:8px;
}
.page-sub{font-size:13px;color:var(--ink-2);margin-top:4px}

/* 日期选择条 */
.datebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.datebar .date-display{
  font-size:15px;font-weight:600;min-width:150px;text-align:center;
  padding:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-2);
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--primary-soft);color:var(--primary)}
.icon-btn svg{width:18px;height:18px}

/* ===== 卡片 ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
.stat-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
}
.stat-card .sc-label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.stat-card .sc-label svg{width:15px;height:15px}
.stat-card .sc-num{font-size:30px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.stat-card .sc-num small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:4px}
.stat-card .sc-sub{font-size:12px;color:var(--ink-3)}
.stat-card::after{
  content:"";position:absolute;right:-26px;top:-26px;width:86px;height:86px;border-radius:50%;
  background:var(--accent);opacity:.07;
}
.stat-card.todo::after{background:var(--blue)}
.stat-card.read::after{background:var(--rose)}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;
}
.panel-title{font-size:15px;font-weight:650;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel-title svg{width:17px;height:17px;color:var(--primary)}

/* ===== 打卡印章 ===== */
.stamp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.stamp-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:12px;position:relative;
}
.stamp-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stamp-name{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650}
.stamp-name svg{width:18px;height:18px;color:var(--accent)}
.stamp-name.ball svg{color:var(--blue)}
.stamp-name.run svg{color:var(--rose)}
.stamp-name.med svg{color:var(--primary)}
.stamp-name.hike svg{color:var(--hike)}
.stamp-row input[type="text"]{flex:1 1 auto;min-width:0;width:auto;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.stamp-seal{
  width:44px;height:44px;border-radius:50%;flex:0 0 44px;
  border:2px dashed var(--line);color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--seal);
}
.stamp-seal svg{width:20px;height:20px}
.stamp-card.done .stamp-seal{
  border:2px solid var(--accent);background:var(--accent);color:#fff;
  box-shadow:0 3px 8px -2px rgba(224,123,57,.5);
  animation:sealPop .3s ease;
}
@keyframes sealPop{0%{transform:scale(.4)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.stamp-row{display:flex;align-items:center;gap:8px}
.stamp-row label{font-size:12px;color:var(--ink-2);flex:0 0 auto;width:34px}
.stamp-row input[type="number"]{
  width:72px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
}
.stamp-row .unit{font-size:12px;color:var(--ink-3)}
.stamp-actions{margin-top:2px;display:flex;gap:8px;justify-content:flex-end}
.btn{
  padding:7px 14px;border-radius:9px;font-size:13px;font-weight:550;
  background:var(--primary);color:#fff;transition:filter .15s,background .15s;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--primary-soft);color:var(--primary)}
.btn.accent{background:var(--accent)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 数字步数行 */
.steps-input{display:flex;align-items:center;gap:8px}
.steps-input input[type="number"]{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:15px}
.steps-hint{font-size:12px;color:var(--ink-3)}

/* ===== 统计图表 ===== */
.stat-zone{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.stat-zone{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{
  width:100%;max-width:34px;min-height:2px;border-radius:6px 6px 2px 2px;
  background:var(--primary);opacity:.85;position:relative;transition:height .3s ease;
}
.bar.dim{background:var(--line)}
.bar-label{font-size:11px;color:var(--ink-3);white-space:nowrap;transform:rotate(0)}
.bar-num{font-size:11px;color:var(--ink-2);font-weight:600}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.legend-row{display:flex;align-items:center;gap:10px;font-size:13px}
.legend-row .l-name{width:58px;color:var(--ink-2)}
.legend-row .l-track{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.legend-row .l-fill{height:100%;border-radius:99px}
.legend-row .l-num{width:34px;text-align:right;font-weight:600}

/* ===== 待办 ===== */
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
}
.todo-item input[type="checkbox"]{
  width:20px;height:20px;accent-color:var(--primary);flex:0 0 20px;cursor:pointer;
}
.todo-item .t-text{flex:1;font-size:14px;word-break:break-word}
.todo-item.done .t-text{text-decoration:line-through;color:var(--ink-3)}
.todo-item .t-date{font-size:12px;color:var(--ink-3);flex:0 0 auto}
.todo-add{display:flex;gap:10px;margin-bottom:14px}
.todo-add input[type="text"]{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.todo-empty,.empty{
  text-align:center;color:var(--ink-3);padding:34px 10px;font-size:13px;
  border:1px dashed var(--line);border-radius:12px;background:var(--surface);
}

/* ===== 日历 ===== */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
@media(max-width:960px){.cal-wrap{grid-template-columns:1fr}}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-size:16px;font-weight:650}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:12px;color:var(--ink-3);padding:6px 0;font-weight:600}
.cal-cell{
  min-height:64px;border-radius:10px;padding:6px 8px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;transition:background .12s,box-shadow .12s;
}
.cal-cell:hover{background:var(--primary-soft);border-color:var(--primary)}
.cal-cell.other{opacity:.4}
.cal-cell.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.cal-cell.selected{background:var(--primary);color:#fff}
.cal-cell.selected .cal-daynum{color:#fff}
.cal-cell.selected .cal-dots span{background:#fff}
.cal-daynum{font-size:13px;font-weight:650}
.dots{display:flex;gap:3px;margin-top:auto;flex-wrap:wrap}
.dots span{width:6px;height:6px;border-radius:50%}
.d-w{background:var(--primary)} .d-t{background:var(--blue)} .d-b{background:var(--rose)}
.day-panel .mini-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mini-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 10px;background:var(--surface-2);border-radius:9px}
.mini-item .mi-tag{flex:0 0 auto;font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600}
.mi-work{background:var(--accent-soft);color:var(--accent-deep)}
.mi-todo{background:var(--blue-soft);color:var(--blue-deep)}
.mi-todo-done{background:var(--primary-soft);color:var(--primary)}
.mini-item.done .mi-text{text-decoration:line-through;color:var(--ink-3)}
.mi-book{background:var(--rose-soft);color:var(--rose-deep)}
.mini-item .mi-text{flex:1;word-break:break-word}
.mini-item .mi-time{font-size:11px;color:var(--ink-3)}


/* ===== 妙记 / 图书馆卡片 ===== */
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.load-more{grid-column:1/-1;display:flex;justify-content:center;margin-top:4px}
.note-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;
  border-top:3px solid var(--accent);
  transition:transform .12s,box-shadow .15s;
}
.note-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.note-card.book{border-top-color:var(--rose)}
.note-card .nc-title{font-size:15px;font-weight:650;word-break:break-word}
.note-card .nc-meta{font-size:12px;color:var(--ink-3)}
.note-card .nc-body{font-size:13px;color:var(--ink-2);word-break:break-word;white-space:pre-wrap}
.note-card .nc-foot{display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
.note-card .nc-foot .icon-btn{width:30px;height:30px}
.search-bar{display:flex;gap:10px;margin-bottom:16px}
.search-bar input[type="text"]{flex:1;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}

/* ===== 模态 ===== */
.modal-bg{
  position:fixed;inset:0;background:rgba(var(--ink-rgb),.45);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal-bg.open{display:flex}
.modal{
  background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lift);
  width:100%;max-width:480px;max-height:88vh;overflow:auto;padding:22px;
}
.modal h3{font-size:16px;margin-bottom:14px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
.modal .field input,.modal .field textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
}
.modal .field textarea{min-height:90px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* ===== 时间线（首页） ===== */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:14px;padding:10px 0;position:relative}
.tl-item::before{content:"";position:absolute;left:8px;top:38px;bottom:-8px;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{flex:0 0 18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);margin-top:4px;position:relative;z-index:1}
.tl-dot.read{border-color:var(--rose)} .tl-dot.note{border-color:var(--accent)} .tl-dot.todo{border-color:var(--blue)}
.tl-body{flex:1}
.tl-line{font-size:13.5px}
.tl-line b{font-weight:650}
.tl-meta{font-size:12px;color:var(--ink-3);margin-top:2px}

/* ===== 通用 ===== */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;
}
.toast.show{opacity:1}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-weight:600}

/* ===== 响应式 ===== */
@media(max-width:768px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:60;
    transform:translateX(-100%);transition:transform .2s ease;width:230px;
  }
  .sidebar.open{transform:translateX(0)}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(var(--ink-rgb),.4);z-index:55}
  .hamburger{
    display:flex;position:fixed;top:14px;left:14px;z-index:70;
    width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;
    align-items:center;justify-content:center;box-shadow:var(--shadow-lift);
  }
  .main{padding:66px 16px 40px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .stat-card .sc-num{font-size:24px}
  .page-title{font-size:19px}
}
/* ===== 年度视图 ===== */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg-btn{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink-3);padding:5px 16px;border-radius:8px;cursor:pointer}
.seg-btn.active{background:var(--surface);color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.10)}
.heat-year{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding:4px 2px}
.hy{width:13px;height:13px;border-radius:3px;background:var(--surface-2);border:1px solid transparent;cursor:pointer}
.hy.l1{background:var(--primary-t1)}.hy.l2{background:var(--primary-t2)}.hy.l3{background:var(--primary-t3)}.hy.l4{background:var(--primary)}
.hy.out{background:transparent;cursor:default}

<!-- 手机与电脑对账用的合并函数（纯函数，电脑上加载了也不会执行） -->
<script src="merge.js"></script>

<script>
"use strict";
/* ===== 数据层 =====
   数据存在电脑上的一个文件里（由本地小服务读写），不再只躺在浏览器缓存中。
   万一没连上服务，会退回浏览器缓存兜底并提示，绝不静默丢数据。 */
const KEY = "lifeworkbench.v1";
let store = def();
let serverReady = false;

/* ===== 同一份页面，跑在两个地方 =====
   电脑上：http://127.0.0.1:8750 —— 直接读写电脑上的数据文件，用法跟以前一模一样
   手机上：GitHub Pages 的地址   —— 数据先存在手机里，回家点"同步"再并进电脑 */
const IS_LOCAL = (location.hostname === "127.0.0.1" || location.hostname === "localhost");
/* 手机同步时要连的电脑地址（回家在手机上可改，存在手机里） */
const PC_BASE_DEFAULT = "http://192.168.161.94:8750";
function pcBase(){ return IS_LOCAL ? "" : (localStorage.getItem("pcBase") || PC_BASE_DEFAULT); }

function def(){
  return { workouts:{}, todos:[], notes:[], books:[] };
}
function isEmptyStore(s){
  try{
    return !Object.keys(s.workouts||{}).length && !(s.todos||[]).length
        && !(s.notes||[]).length && !(s.books||[]).length;
  }catch(e){ return true; }
}
function lsRead(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function lsWrite(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }

/* 手机连电脑时浏览器会先问一次"允许访问本地网络吗"，targetAddressSpace 是给它的说明。
   timeoutMs：连不上电脑时别把页面卡死 —— 在外面连不上是常态。 */
async function fetchData(timeoutMs){
  const opts = {cache:"no-store", targetAddressSpace:"local"};
  if(timeoutMs){
    const ac = new AbortController();
    opts.signal = ac.signal;
    setTimeout(()=>ac.abort(), timeoutMs);
  }
  const r = await fetch(pcBase() + "/api/data", opts);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}
async function pushData(o){
  const r = await fetch(pcBase() + "/api/data", {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(o),
    targetAddressSpace:"local"
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  return true;
}

/* 首次打开时：把浏览器里已有的旧数据搬进数据文件，一条不丢 */
async function dataLayerInit(){
  const local = lsRead();

  /* ---- 手机版：一切以手机里这份为准 ----
     手机不往电脑自动推，只有回家点"同步"才并过去；只有第一次用（手机里空的）才从电脑取一份。 */
  if(!IS_LOCAL){
    store = Object.assign(def(), local || {});
    serverReady = false;
    if(isEmptyStore(store)){
      /* 第一次用：背后问问电脑有没有数据。连不上就当空着（在外面连不上是常态），
         绝不 await —— 不能因为连不上电脑就把页面卡成白屏。 */
      fetchData(3000).then(function(d){
        if(isEmptyStore(store)){
          store = Object.assign(def(), d || {});
          lsWrite(store);
          if(typeof render === "function") render(routeNow());
          toast("已从电脑取回一份数据");
        }
      }).catch(function(){});
    }
    const el0 = document.getElementById("datapath");
    if(el0) el0.textContent = "数据存在这台手机里";
    return;
  }

  try{
    const d = await fetchData();
    store = Object.assign(def(), d || {});
    serverReady = true;
    try{
      const w = await (await fetch("/api/where", {cache:"no-store"})).json();
      const el = document.getElementById("datapath");
      if(el && w.windows_folder){
        el.textContent = "数据存在 " + w.windows_folder + "\\";
        el.title = w.windows_data_file || "";
      }
    }catch(e2){}
  }catch(e){
    serverReady = false;
    store = Object.assign(def(), local || {});
    setTimeout(()=>toast("没连上数据服务，这次改动只暂存在浏览器里"), 600);
    return;
  }
  if(isEmptyStore(store) && local && !isEmptyStore(local)){
    store = Object.assign(def(), local);
    try{ await pushData(store); toast("已把浏览器里的旧记录搬进数据文件"); }catch(e){}
  }
}
function save(){
  lsWrite(store);                       // 顺手留一份兜底副本
  if(!serverReady) return;
  pushData(store).catch(()=>{ toast("这次没存进文件，请检查数据服务"); });
}

/* ===== 回家同步（只在手机上用）=====
   规则：电脑那份是主账本 —— 手机记的并进去，电脑上已有的绝不被手机覆盖。
   手机同步后不清空，在外面还能翻历史。 */
async function syncNow(){
  const btn = document.getElementById("sync-btn");
  if(btn) btn.disabled = true;
  try{
    const pcData = await fetchData(8000);                 // 电脑那份（连不上就 8 秒放弃）
    const clash  = listPhoneOnlyConflicts(pcData, store); // 两边都记过的（只提示，不改结果）
    const merged = mergeStore(pcData, store);             // 电脑优先 + 手机补空缺
    await pushData(merged);                               // 写回电脑
    store = merged; lsWrite(store);                       // 手机上留合并后的完整一份
    if(typeof render === "function") render(routeNow());
    toast(clash.length
      ? "同步完成；有 " + clash.length + " 处两边都记过，按电脑上的为准"
      : "同步完成，手机记的已并进电脑");
  }catch(e){
    toast("没连上电脑 —— 确认手机和电脑连的是同一个 WiFi、电脑开着，浏览器问「允许访问本地网络」时点了允许");

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function parseDate(s){ const p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(s, n){ const d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }
function dayOfWeekCN(s){ return ["日","一","二","三","四","五","六"][parseDate(s).getDay()]; }
function cnDate(s){ const d=parseDate(s); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
function cnFull(s){ const d=parseDate(s); return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"; }
function diffDays(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }

  // 本月汇总 + 环比上月：跟着日历上正显示的那个月走

  renderCompare(mPrefix);

function weekRange(){
  // 本周一 ~ 本周日
  const today=parseDate(todayStr());
  const monday=addDays(todayStr(), -((today.getDay()+6)%7));
  return [monday, addDays(monday,6)];
}
function renderWeekLegend(){
  const [mon,sun]=weekRange();
  const counts={steps:0,run:0,hike:0,meditate:0,ball:0,sleep:0};
  for(let i=0;i<7;i++){
    const d=addDays(mon,i), w=store.workouts[d];
    if(!w) continue;
    if(w.steps>0) counts.steps++;
    if(w.run&&w.run.done) counts.run++;
    if(w.hike&&w.hike.done) counts.hike++;
    if(w.meditate&&w.meditate.done) counts.meditate++;
    if(w.ball&&w.ball.done) counts.ball++;
    if(w.sleep&&w.sleep.done) counts.sleep++;
  }
  const max=Math.max(1,...Object.values(counts));
  const COLORS={steps:"var(--accent)",run:"var(--rose)",hike:"var(--hike)",meditate:"var(--primary)",ball:"var(--blue)",sleep:"var(--primary-deep)"};
  const rows=enabledItems().map(k=>[CHECK_META[k].name, counts[k], COLORS[k]]);
  document.getElementById("week-legend").innerHTML = rows.map(([n,c,col])=>`
    <div class="legend-row">
      <div class="l-name">${n}</div>
      <div class="l-track"><div class="l-fill" style="width:${Math.round(c/max*100)}%;background:${col}"></div></div>
      <div class="l-num">${c} 次</div>
    </div>`).join("");
}
function renderTrend(){
  const days=[];
  const enabled=enabledItems();
  for(let i=13;i>=0;i--){
    const d=addDays(todayStr(),-i);
    const w=store.workouts[d];
    let c=0;
    if(w){ enabled.forEach(k=>{ if(itemDone(k,w)) c++; }); }
    days.push({d, c});
  }
  const max=Math.max(1,...days.map(x=>x.c));
  document.getElementById("trend-bars").innerHTML = days.map(x=>`
    <div class="bar-col">
      <div class="bar-num">${x.c||""}</div>
      <div class="bar ${x.c===0?"dim":""}" style="height:${Math.round(x.c/max*100)}%"></div>
      <div class="bar-label">${x.d.slice(8)}</div>
    </div>`).join("");
}

let WX={}, WXCITY=null;
const WMO={0:["晴","☀"],1:["少云","⛅"],2:["多云","⛅"],3:["阴","☁"],
  45:["雾","☁"],48:["雾凇","☁"],51:["毛毛雨","☔"],53:["毛毛雨","☔"],55:["毛毛雨","☔"],
  56:["冻雨","☔"],57:["冻雨","☔"],61:["小雨","☔"],63:["中雨","☔"],65:["大雨","☔"],
  66:["冻雨","☔"],67:["冻雨","☔"],71:["小雪","❄"],73:["中雪","❄"],75:["大雪","❄"],
  77:["米雪","❄"],80:["阵雨","☔"],81:["阵雨","☔"],82:["强阵雨","☔"],85:["阵雪","❄"],
  86:["阵雪","❄"],95:["雷阵雨","⚡"],96:["雷雨冰雹","⚡"],99:["雷雨冰雹","⚡"]};
function wxText(c){const w=WMO[c];return w?w[0]:"";}
function wxIcon(c){const w=WMO[c];return w?w[1]:"☁";}
function wxIsRain(c){return (c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;}
function wxLine(ds){
  const w=WX[ds];
  if(!w||w.c===null||w.c===undefined) return "";
  let s=wxIcon(w.c)+" "+wxText(w.c);
  if(w.tn!==null&&w.tn!==undefined&&w.tx!==null&&w.tx!==undefined)
    s+=" "+Math.round(w.tn)+"~"+Math.round(w.tx)+"°C";

       WXCITY=(d&&d.city)||null; }catch(e){ WXCITY=null; }

async function wxLoad(from,to){
  if(!from) return;
  try{
    const r=await fetch("/api/weather?from="+from+"&to="+(to||from),{cache:"no-store"});
    const d=await r.json();
    if(d&&d.days) Object.assign(WX,d.days);

  }catch(e){}

function wxMonthRange(){
  const p=calYear+"-"+String(calMonth+1).padStart(2,"0");
  return [p+"-01", p+"-"+String(new Date(calYear,calMonth+1,0).getDate()).padStart(2,"0")];
}
function wxMonthSummary(){
  const p=calYear+"-"+String(calMonth+1).padStart(2,"0");
  const t=todayStr();
  let sun=0,rain=0,tn=1e9,tx=-1e9,n=0;
  Object.keys(WX).forEach(k=>{
    if(k.slice(0,7)!==p) return;
    if(k>t) return;                  // 只算已经过去的日子（含今天），预报不算进"本月回顾"
    const w=WX[k]; if(!w||w.c===null||w.c===undefined) return;
    n++; if(w.c<=1) sun++; if(wxIsRain(w.c)) rain++;
    if(w.tn!==null&&w.tn!==undefined) tn=Math.min(tn,w.tn);
    if(w.tx!==null&&w.tx!==undefined) tx=Math.max(tx,w.tx);
  });
  if(!n) return "";
  let s="本月 晴 "+sun+" 天 · 雨 "+rain+" 天";
  if(tn<1e9) s+=" · "+Math.round(tn)+"~"+Math.round(tx)+"°C";
  return s;
}

/* ===== 汇总统计（月 / 年共用同一套口径，避免两处数字打架） ===== */
function fmtMin(m){
  m=Math.round(+m||0);
  if(m<60) return m+" 分钟";
  const h=Math.floor(m/60), r=m%60;
  return h+" 小时"+(r?" "+r+" 分":"");
}
function scopeStats(prefix){
  // prefix: "2026"（整年）或 "2026-10"（某月）
  const P=prefix.length, has=k=>k.slice(0,P)===prefix;
  let runN=0,runKm=0,runMin=0,hikeN=0,hikeKm=0,hikeMin=0,medN=0,medMin=0,ballN=0,ballMin=0,sleepN=0,stepDays=0,stepTotal=0;
  const wkeys=Object.keys(store.workouts).filter(has).sort();
  let lastWeight=null;
  for(let i=wkeys.length-1;i>=0;i--){ const ww=store.workouts[wkeys[i]]; if(ww.weight>0){ lastWeight=ww.weight; break; } }
  Object.keys(store.workouts).forEach(k=>{
    if(!has(k)) return;
    const w=store.workouts[k];
    if(w.steps>0){ stepDays++; stepTotal+=(+w.steps||0); }
    if(w.run&&w.run.done){ runN++; runKm+=(+w.run.km||0); runMin+=(+w.run.min||0); }
    if(w.hike&&w.hike.done){ hikeN++; hikeKm+=(+w.hike.km||0); hikeMin+=(+w.hike.min||0); }
    if(w.meditate&&w.meditate.done){ medN++; medMin+=(+w.meditate.min||0); }
    if(w.ball&&w.ball.done){ ballN++; ballMin+=(+w.ball.min||0); }
    if(w.sleep&&w.sleep.done){ sleepN++; }
  });
  const daySet={};
  Object.keys(store.workouts).forEach(k=>{ if(has(k)&&activeDay(k)) daySet[k]=1; });
  store.todos.forEach(t=>{ if(t.date.slice(0,P)===prefix && activeDay(t.date)) daySet[t.date]=1; });
  store.books.forEach(b=>{ if(b.date.slice(0,P)===prefix && activeDay(b.date)) daySet[b.date]=1; });
  const sorted=Object.keys(daySet).sort();
  let best=0,cur=0,prev=null;
  sorted.forEach(k=>{ cur=(prev && diffDays(prev,k)===1)?cur+1:1; prev=k; if(cur>best) best=cur; });
  const bk=store.books.filter(b=>b.date.slice(0,P)===prefix);
  const bookMin=bk.reduce((a,b)=>a+(+b.min||0),0);
  return [
    {l:"步数合计", n:stepTotal.toLocaleString(), s:"步"},
    {l:"平均每天", n:(stepDays?Math.round(stepTotal/stepDays):0).toLocaleString(), s:"步"},
    {l:"有记录的天数", n:sorted.length, s:"天"},
    {l:"最长连续", n:best, s:"天"},
    {l:"体重", n:lastWeight===null?"—":lastWeight, s:"kg"},
    {l:"跑步", n:runN, s:"次"},
    {l:"跑步距离", n:Math.round(runKm*10)/10, s:"公里"},
    {l:"徒步", n:hikeN, s:"次"},
    {l:"徒步距离", n:Math.round(hikeKm*10)/10, s:"公里"},
    {l:"静坐", n:medN, s:"次"},
    {l:"早睡", n:sleepN, s:"次"},
    {l:"打球", n:ballN, s:"次"},
    {l:"运动总时长", n:Math.round((runMin+hikeMin+medMin+ballMin)/60*10)/10, s:"小时"},
    {l:"读书", n:bk.length, s:"本"},
    {l:"阅读时长", n:bookMin, s:"分钟"},
    {l:"待办完成", n:store.todos.filter(t=>t.done&&t.date.slice(0,P)===prefix).length, s:"条"}
  ];
}
function fillStats(elId, prefix){
  document.getElementById(elId).innerHTML = scopeStats(prefix).map(i=>
    `<div class="ys-item"><div class="ys-label">${i.l}</div><div class="ys-num">${i.n}<small>${i.s}</small></div></div>`).join("");
}
/* ===== 环比上月：跟着日历上正显示的那个月走，挑最想看的几项 ===== */
function prevPrefix(p){
  const y=+p.slice(0,4), m=+p.slice(5,7);
  return m===1 ? (y-1)+"-12" : y+"-"+String(m-1).padStart(2,"0");
}
function renderCompare(prefix){
  const el=document.getElementById("month-compare");
  if(!el) return;
  const cur=scopeStats(prefix), prev=scopeStats(prevPrefix(prefix));
  const labels=["有记录的天数","步数合计","跑步","静坐","早睡","运动总时长","读书","阅读时长"];
  el.innerHTML=labels.map(label=>{
    const c=cur.find(x=>x.l===label)||{n:0,s:""}, p=prev.find(x=>x.l===label)||{n:0,s:""};
    const d=(+c.n)-(+p.n||0);
    let mark, cls;
    if(d>0){ cls="up"; mark="比上月 +"+d+" "+c.s; }
    else if(d<0){ cls="down"; mark="比上月 "+d+" "+c.s; }
    else { cls="flat"; mark="与上月持平"; }
    return `<div class="ys-item"><div class="ys-label">${label}</div>
      <div class="ys-num">${c.n}<small>${c.s}</small></div>
      <div class="ys-delta ${cls}" title="上月 ${p.n}${p.s}">${mark}</div></div>`;
  }).join("");
}

/* ===== 年度视图（一整年一眼看完 + 年汇总） ===== */
let calMode="month";

function activeDay(ds){
  const w=store.workouts[ds];
  if(w && (w.steps>0 || w.weight>0 || (w.run&&w.run.done) || (w.hike&&w.hike.done) || (w.meditate&&w.meditate.done) || (w.ball&&w.ball.done) || (w.sleep&&w.sleep.done))) return true;
  return store.todos.some(t=>t.date===ds) || store.books.some(b=>b.date===ds);
}
function dayLevel(ds){
  const w=store.workouts[ds]||{};
  let n=0;
  if(w.steps>0) n++;
  if(w.weight>0) n++;
  if(w.run&&w.run.done) n++;
  if(w.hike&&w.hike.done) n++;
  if(w.meditate&&w.meditate.done) n++;
  if(w.ball&&w.ball.done) n++;
  if(w.sleep&&w.sleep.done) n++;
  if(store.todos.some(t=>t.date===ds)) n++;
  if(store.books.some(b=>b.date===ds)) n++;
  return Math.min(n,4);
}
function dayTip(ds){
  const w=store.workouts[ds]||{}, p=[];
  if(w.steps>0) p.push("步数 "+w.steps);
  if(w.weight>0) p.push("体重 "+w.weight+"kg");
  if(w.run&&w.run.done) p.push("跑步"+(w.run.km?" "+w.run.km+"km":"")+(w.run.min?"·"+w.run.min+"min":""));
  if(w.hike&&w.hike.done) p.push("徒步"+(w.hike.km?" "+w.hike.km+"km":"")+(w.hike.min?"·"+w.hike.min+"min":"")+(w.hike.place?"·"+w.hike.place:""));
  if(w.meditate&&w.meditate.done) p.push("静坐"+(w.meditate.min?" "+w.meditate.min+"min":""));
  if(w.ball&&w.ball.done) p.push("打球"+(w.ball.min?" "+w.ball.min+"min":""));
  if(w.sleep&&w.sleep.done) p.push("早睡"+(w.sleep.time?" "+w.sleep.time:""));
  const t=store.todos.filter(x=>x.date===ds).length;
  if(t) p.push("待办 "+t+" 条");
  const b=store.books.filter(x=>x.date===ds).length;
  if(b) p.push("读书 "+b+" 本");
  return cnFull(ds)+(p.length?"："+p.join("、"):"：没有记录");
}
function renderYear(){
  const y=calYear;
  document.getElementById("year-title").textContent = y+" 年";
  document.getElementById("home-date").textContent = y+" 年 · 全年（点小方格回到那天）";

  // 1) 全年热力图：周一开头，每列一周
  const jan1=new Date(y,0,1), dec31=new Date(y,11,31);
  const d=new Date(y,0,1-((jan1.getDay()+6)%7));
  const total=Math.round((dec31-d)/86400000)+1+((6-((dec31.getDay()+6)%7)));
  let html="";
  for(let i=0;i<total;i++){
    const ds=fmtDate(d);
    if(d.getFullYear()!==y){ html+='<div class="hy out"></div>'; }
    else{
      const lv=dayLevel(ds);
      html+=`<div class="hy${lv?" l"+lv:""}" data-d="${ds}" title="${escapeAttr(dayTip(ds))}"></div>`;
    }
    d.setDate(d.getDate()+1);
  }
  const heat=document.getElementById("year-heat");
  heat.innerHTML=html;
  heat.querySelectorAll(".hy[data-d]").forEach(c=>c.addEventListener("click",()=>{
    const ds=c.dataset.d, p=ds.split("-");
    calSelected=ds; calYear=+p[0]; calMonth=+p[1]-1; calMode="month";
    document.getElementById("cal-mode-year").classList.remove("active");
    document.getElementById("cal-mode-month").classList.add("active");
    document.getElementById("cal-year-wrap").style.display="none";
    document.getElementById("cal-month-wrap").style.display="";
    renderCalendar();
  }));

  // 2) 年度汇总（口径与「本月汇总」共用 scopeStats）
  fillStats("year-summary", String(y));

  // 3) 每月运动次数
  const mon=Array(12).fill(0);
  Object.keys(store.workouts).forEach(k=>{
    if(k.slice(0,4)!==String(y)) return;
    const w=store.workouts[k];
    let n=0;
    if(w.run&&w.run.done) n++;
    if(w.hike&&w.hike.done) n++;
    if(w.meditate&&w.meditate.done) n++;
    if(w.ball&&w.ball.done) n++;
    if(w.steps>0) n++;
    mon[+k.slice(5,7)-1]+=n;
  });
  const mx=Math.max(1, ...mon);
  document.getElementById("year-bars").innerHTML = mon.map((v,i)=>
    `<div class="yb" title="${i+1}月：${v} 次"><div class="yb-bar" data-m="${i}" style="height:${Math.max(2,Math.round(v/mx*108))}px;opacity:${v?0.85:0.22}"></div><div class="yb-m">${i+1}</div></div>`).join("");
  document.getElementById("year-bars").querySelectorAll(".yb-bar").forEach(b=>b.addEventListener("click",()=>{
    calMonth=+b.dataset.m; setCalMode("month");
  }));
}

function setCalMode(m){
  calMode=m;
  document.getElementById("cal-mode-month").classList.toggle("active", m==="month");
  document.getElementById("cal-mode-year").classList.toggle("active", m==="year");
  document.getElementById("cal-month-wrap").style.display = m==="month" ? "" : "none";
  document.getElementById("cal-year-wrap").style.display = m==="year" ? "" : "none";
  if(m==="year") renderYear(); else renderCalendar();
}
document.getElementById("cal-mode-month").addEventListener("click",()=>setCalMode("month"));
document.getElementById("cal-mode-year").addEventListener("click",()=>setCalMode("year"));
document.getElementById("year-prev").addEventListener("click",()=>{ calYear--; renderYear(); });
document.getElementById("year-next").addEventListener("click",()=>{ calYear++; renderYear(); });

/* ===== 妙记 ===== */
function renderNotes(){
  const kw=searchNotes.trim().toLowerCase();
  const list=store.notes.filter(n=>!kw||n.title.toLowerCase().includes(kw)||n.content.toLowerCase().includes(kw))
    .sort((a,b)=>b.updated.localeCompare(a.updated));
  document.getElementById("notes-sub").textContent = "共 "+store.notes.length+" 条";
  const el=document.getElementById("note-grid");
  if(!list.length){ el.innerHTML='<div class="empty">还没有灵感记录，点右上角写一条</div>'; return; }
  const total=list.length, shown=Math.min(total, notesPage*PAGE_SIZE);
  el.innerHTML=list.slice(0,shown).map(n=>`
    <div class="note-card">
      <div class="nc-title">${escapeHtml(n.title)}</div>
      <div class="nc-meta">${n.updated.slice(0,16).replace("T"," ")}</div>
      <div class="nc-body">${escapeHtml(n.content)}</div>
      <div class="nc-foot">
        <button class="icon-btn" data-edit="${n.id}" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="icon-btn" data-del="${n.id}" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>
      </div>
    </div>`).join("");
  if(total>shown) el.insertAdjacentHTML("beforeend",
    '<div class="load-more"><button class="btn ghost" id="notes-more">加载更多（还剩 '+(total-shown)+' 条）</button></div>');
  const more=document.getElementById("notes-more");
  if(more) more.addEventListener("click",()=>{ notesPage++; renderNotes(); });
  bindCardActions(el, "note");
}
document.getElementById("note-new").addEventListener("click",()=>openModal("note",null));
document.getElementById("notes-search").addEventListener("input",e=>{ searchNotes=e.target.value; notesPage=1; renderNotes(); });

/* ===== 图书馆 ===== */
function renderLibrary(){
  const kw=searchBooks.trim().toLowerCase();
  const list=store.books.filter(b=>!kw||b.name.toLowerCase().includes(kw)||(b.author||"").toLowerCase().includes(kw))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const allMin=store.books.reduce((a,b)=>a+(+b.min||0),0);
  document.getElementById("library-sub").textContent = "共 "+store.books.length+" 本"+(allMin?" · 累计阅读 "+fmtMin(allMin):"");
  const el=document.getElementById("book-grid");
  if(!list.length){ el.innerHTML='<div class="empty">书架还空着，添加第一本书吧</div>'; return; }
  const total=list.length, shown=Math.min(total, booksPage*PAGE_SIZE);
  el.innerHTML=list.slice(0,shown).map(b=>`
    <div class="note-card book">
      <div class="nc-title">${escapeHtml(b.name)}</div>
      <div class="nc-meta">${b.author?"作者："+escapeHtml(b.author)+" · ":""}${cnDate(b.date)}${b.min?" · 阅读 "+fmtMin(b.min):""}</div>
      ${b.note?`<div class="nc-body">${escapeHtml(b.note)}</div>`:""}
      <div class="nc-foot">
        <button class="icon-btn" data-edit="${b.id}" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="icon-btn" data-del="${b.id}" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>
      </div>
    </div>`).join("");
  if(total>shown) el.insertAdjacentHTML("beforeend",
    '<div class="load-more"><button class="btn ghost" id="books-more">加载更多（还剩 '+(total-shown)+' 本）</button></div>');
  const more=document.getElementById("books-more");
  if(more) more.addEventListener("click",()=>{ booksPage++; renderLibrary(); });
  bindCardActions(el, "book");
}
document.getElementById("book-new").addEventListener("click",()=>openModal("book",null));
document.getElementById("books-search").addEventListener("input",e=>{ searchBooks=e.target.value; booksPage=1; renderLibrary(); });

function bindCardActions(root, type){
  root.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{
    const item=store[type+"s"].find(x=>x.id===b.dataset.edit);
    openModal(type,item);
  }));
  root.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    store[type+"s"]=store[type+"s"].filter(x=>x.id!==b.dataset.del);
    if(type==="note") notesPage=1; else booksPage=1;
    save();
    if(type==="book"){ renderLibrary(); renderHome(); if(routeNow()==="calendar") renderCalendar(); }
    else renderNotes();
    toast("已删除");
  }));
}

/* ===== 模态 ===== */
const modal=document.getElementById("modal-bg");
function openCheckManage(){
  modalCtx={type:"check", item:null};
  document.getElementById("modal-title").textContent="打卡项管理";
  const en=SETTINGS.check_items||[];
  document.getElementById("modal-fields").innerHTML=
    '<div style="font-size:13px;color:var(--ink-2);margin-bottom:8px">勾选要显示的打卡项，打卡分母按勾选数算：</div>'+
    CHECK_ITEMS.map(it=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 2px;cursor:pointer;font-size:14px">
      <input type="checkbox" id="chk-${it.k}" style="width:17px;height:17px;accent-color:var(--primary)" ${en.includes(it.k)?"checked":""}> ${it.name}</label>`).join("");
  modal.classList.add("open");
}
async function saveSettings(){
  try{
    const r=await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({check_items:SETTINGS.check_items})});
    if(!r.ok) toast("设置没存进文件");
  }catch(e){ toast("设置没存进文件"); }
}
async function loadSettings(){
  try{
    const r=await fetch("/api/settings",{cache:"no-store"});
    const d=await r.json();
    if(d){ if(d.city) WXCITY=d.city; if(Array.isArray(d.check_items)&&d.check_items.length) SETTINGS.check_items=d.check_items; }
  }catch(e){}
}
document.getElementById("check-manage").addEventListener("click",openCheckManage);
function openModal(type, item){
  modalCtx={type, item};
  document.getElementById("modal-title").textContent = type==="note"
    ? (item?"编辑灵感":"写一条灵感")
    : (item?"编辑书籍":"添加一本书");
  let fields="";
  if(type==="note"){
    fields=`
      <div class="field"><label>标题</label><input id="m-title" maxlength="40" value="${item?escapeAttr(item.title):""}" placeholder="给灵感起个名字"></div>
      <div class="field"><label>内容</label><textarea id="m-content" placeholder="随手记下此刻的想法…">${item?escapeAttr(item.content):""}</textarea></div>`;
  }else{
    fields=`
      <div class="field"><label>书名</label><input id="m-name" maxlength="60" value="${item?escapeAttr(item.name):""}" placeholder="在读什么书"></div>
      <div class="field"><label>作者（可选）</label><input id="m-author" maxlength="40" value="${item?escapeAttr(item.author||""):""}" placeholder="作者"></div>
      <div class="field"><label>阅读时长（分钟，可选）</label><input type="number" id="m-min" min="0" step="1" value="${item&&item.min?item.min:""}" placeholder="这本书一共读了多少分钟"></div>
      <div class="field"><label>阅读日期</label><input type="date" id="m-date" value="${item?item.date:todayStr()}"></div>
      <div class="field"><label>备注（进度 / 感想，可选）</label><textarea id="m-note" placeholder="看到哪了、想记什么…">${item?escapeAttr(item.note||""):""}</textarea></div>`;
  }
  document.getElementById("modal-fields").innerHTML=fields;
  modal.classList.add("open");
}
document.getElementById("modal-cancel").addEventListener("click",()=>modal.classList.remove("open"));
modal.addEventListener("click",e=>{ if(e.target===modal) modal.classList.remove("open"); });
document.getElementById("modal-save").addEventListener("click",()=>{
  if(!modalCtx) return;
  const {type,item}=modalCtx;
  if(type==="check"){
    const chosen=CHECK_ITEMS.filter(it=>{ const cb=document.getElementById("chk-"+it.k); return cb&&cb.checked; }).map(it=>it.k);
    if(!chosen.length){ toast("至少保留一项"); return; }
    SETTINGS.check_items=chosen;
    saveSettings();
    modal.classList.remove("open"); renderSport(); renderHome(); toast("打卡项已保存");
    return;
  }
  if(type==="note"){
    const title=document.getElementById("m-title").value.trim()||"未命名灵感";
    const content=document.getElementById("m-content").value.trim();
    if(item){ item.title=title; item.content=content; item.updated=isoNow(); }
    else store.notes.push({id:uid(), title, content, updated:isoNow()});
    notesPage=1; save(); renderNotes(); renderHome();
  }else{
    const name=document.getElementById("m-name").value.trim();
    if(!name){ toast("请填写书名"); return; }
    const author=document.getElementById("m-author").value.trim();
    const date=document.getElementById("m-date").value||todayStr();
    const note=document.getElementById("m-note").value.trim();
    const min=Math.max(0,Math.round(+document.getElementById("m-min").value||0));
    if(item){ item.name=name; item.author=author; item.date=date; item.note=note; item.min=min; }
    else store.books.push({id:uid(), name, author, date, note, min, created:Date.now()});
    booksPage=1; save(); renderLibrary(); renderHome(); if(routeNow()==="calendar") renderCalendar();
  }
  modal.classList.remove("open"); toast("已保存");
});
function isoNow(){ const d=new Date(); return fmtDate(d)+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

/* ===== 工具 ===== */
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,"&#39;"); }
function routeNow(){ return (location.hash||"#/calendar").replace(/^#\//,"").split("?")[0]; }
/* ===== 日期导航绑定 ===== */
document.querySelectorAll(".datebar [data-nav]").forEach(b=>b.addEventListener("click",()=>{
  const dir=+b.dataset.nav;
  if(routeNow()==="sport"){ curSport=addDays(curSport,dir); renderSport(); }
  else if(routeNow()==="todo"){ curTodo=addDays(curTodo,dir); renderTodo(); }
}));
document.getElementById("sport-today").addEventListener("click",()=>{ curSport=todayStr(); renderSport(); });
document.getElementById("todo-today").addEventListener("click",()=>{ curTodo=todayStr(); renderTodo(); });

/* ===== 启动 ===== */
dataLayerInit().then(async()=>{ await loadSettings(); calInit(); route(); });

/* ===== 手机版专属：亮出"同步"按钮，并打开离线缓存 ===== */
if(!IS_LOCAL){
  const sb = document.getElementById("sync-btn");
  if(sb){
    sb.style.display = "";
    sb.addEventListener("click", ()=>{ closeSidebar(); syncNow(); });
  }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
}
</script>
</body>
</html>
